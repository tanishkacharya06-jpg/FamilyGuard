name: Build FamilyGuard APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'FamilyGuard.zip'
      - 'FamilyGuard-GitHub-Ready.zip'
      - 'FamilyGuard/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          if [[ -f FamilyGuard-GitHub-Ready.zip ]]; then
            archive="FamilyGuard-GitHub-Ready.zip"
          elif [[ -f FamilyGuard.zip ]]; then
            archive="FamilyGuard.zip"
          else
            echo "::error::Upload FamilyGuard-GitHub-Ready.zip or FamilyGuard.zip to the repository root."
            exit 1
          fi
          unzip -q "$archive"
          test -f FamilyGuard/settings.gradle.kts
          test -f FamilyGuard/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build release APK
        working-directory: FamilyGuard
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK
        run: |
          APK="FamilyGuard/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" FamilyGuard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyGuard-apk
          path: FamilyGuard.apk
          if-no-files-found: error
          retention-days: 30
